<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salmiz Balance</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
    body {
      background: #000;
      color: #fff;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
    }
    #canvas {
      border: 1px solid #fff;
      background: #fff;
    }
    .tools {
      margin: 10px;
    }
    button {
      background: #8B0000;
      color: #fff;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .footer {
      font-size: 12px;
      color: grey;
      margin-top: 20px;
    }
  </style>
</head>
<body dir="rtl">
  <h1>سلمى</h1>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="tools">
    <button onclick="changeColor('red')">أحمر</button>
    <button onclick="changeColor('blue')">أزرق</button>
    <button onclick="changeColor('black')">أسود</button>
    <button onclick="clearCanvas()">مسح</button>
  </div>
  <p class="footer">بواسطه حفى</p>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let color = 'black';

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mousedown', (e) => {
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    function changeColor(c) {
      color = c;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>
</body>
</html>
